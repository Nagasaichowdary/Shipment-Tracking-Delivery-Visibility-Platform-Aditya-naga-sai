# ─────────────────────────────────────────────────────────────
# Proof of Delivery — File Upload Configuration
# ─────────────────────────────────────────────────────────────
# Root directory where delivery photos and signature files are stored.
# Relative paths are resolved from the JVM working directory (project root).
app.upload.dir=uploads

# Allow files up to 6 MB so that the 5 MB photo limit + multipart envelope fits.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=12MB