server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: serve index.html for any path that doesn't match a real file.
    # Without this, refreshing any non-root URL (e.g. /login, /dashboard) returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive caching for hashed JS/CSS assets (Vite generates content-addressed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html so browsers always fetch the latest entry point.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}