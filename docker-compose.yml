services:
  backend:
    build:
      context: ./backend
    image: shiptrack-backend
    container_name: shiptrack-backend
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_final
    image: shiptrack-frontend
    container_name: shiptrack-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
